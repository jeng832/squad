plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.squad'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot (web-application-type: none)
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Picocli + JLine3
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'info.picocli:picocli-shell-jline3:4.7.7'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

    // JLine3
    implementation 'org.jline:jline:3.25.1'

    // WebSocket STOMP Client
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def buildMcpServer = providers.gradleProperty('mcpServer')
        .map { it.toBoolean() }
        .orElse(false)

tasks.named('bootJar') {
    if (buildMcpServer.get()) {
        archiveBaseName = 'squad-mcp-server'
        mainClass = 'com.squad.cli.mcp.SquadMcpServerApplication'
    } else {
        archiveBaseName = 'squad-cli'
        mainClass = 'com.squad.cli.SquadCliApplication'
    }
}
